<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivot — Data Master Tanah</title>
<meta name="description" content="Analisis pivot sederhana data master tanah: kelompok tetap kode satker dan nama satker, pilih ukuran yang ingin dihitung.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E6B4F'/%3E%3Cpath d='M8 17.5l5 5 11-12' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261004-14">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
</head>
<body class="pivot-page">

<header class="topbar">
  <div class="brand">
    <h1><a class="brand-link" href="index.html">Data Master Tanah</a></h1>
  </div>
  <div class="topbar-actions">
    <a class="btn" href="index.html">← Tabel</a>
  </div>
</header>

<section class="tools pivot-tools" aria-label="Pengaturan pivot">
  <input type="search" id="pivotSearch" class="search" placeholder="Saring baris (semua kolom)…" aria-label="Saring baris pada semua kolom">
  <p class="pivot-info" id="pivotInfo"></p>
  <span class="spacer"></span>
  <button type="button" class="btn primary" id="pivotExport">Export pivot</button>
</section>

<section class="pivot-measures" aria-label="Ukuran pivot">
  <div class="measure-block">
    <span class="measure-title">Ukuran:</span>
    <label class="check-inline"><input type="checkbox" id="mCount" checked> Jumlah baris</label>
    <label class="check-inline"><input type="checkbox" id="mLuas"> Σ luas</label>
  </div>
  <div class="measure-block">
    <span class="measure-title">Hitung kosong / 0:</span>
    <div class="check-grid" id="missingBoxes"></div>
  </div>
</section>

<main class="tablewrap" id="tableWrap">
  <table class="pivot-table" id="pivotTable">
    <thead><tr id="pivotHead"></tr></thead>
    <tbody id="pivotBody"></tbody>
    <tfoot><tr id="pivotFoot"></tr></tfoot>
  </table>
  <p class="empty" id="pivotEmpty" hidden>Tidak ada grup yang cocok dengan pencarian.</p>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="pivot.js?v=20261004-14"></script>
</body>
</html>
